server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy de prueba hacia ORDS.
    # Permite probar:
    # iPhone -> este Docker -> ORDS
    location = /proxy-upload {

        proxy_pass https://dbylfn34rhv0ebz-falcodev.adb.us-ashburn-1.oraclecloudapps.com/ords/salescoaching/services/prequalified-files/upload;

        proxy_ssl_server_name on;

        proxy_set_header Host dbylfn34rhv0ebz-falcodev.adb.us-ashburn-1.oraclecloudapps.com;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering off;
        proxy_buffering off;
    }
}